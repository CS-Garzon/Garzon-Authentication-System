<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/5865f2/shopping-cart.png" />
    <title>Shopping Cart Midterm</title>
</head>
<body class="bg-[#121214] text-white min-h-screen">

    <nav class="bg-[#1a1a1e] p-4 flex justify-between items-center border-b border-zinc-800 sticky top-0 z-20">
        <h1 class="text-2xl font-black text-[#5865f2]">Student Shop</h1>
        
        <div class="flex items-center gap-4">
            <p class="text-sm">Hi, <span id="uName" class="font-bold text-[#5865f2]"></span></p>
            <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 text-white text-sm font-bold py-1 px-4 rounded transition-all">Logout</button>
        </div>
    </nav>

    <div class="flex flex-col md:flex-row max-w-7xl mx-auto mt-6 px-4 gap-6 relative">
        
        <div class="w-full md:w-3/4">
            
            <h2 class="text-xl font-bold mb-4">Products</h2>

            <div class="bg-[#1a1a1e] p-4 rounded-md flex flex-wrap gap-4 mb-6 border border-zinc-800 items-end shadow-md">
                
                <div class="flex flex-col">
                    <label class="text-xs text-zinc-400 mb-1 font-bold uppercase">Category</label>
                    <select id="categorySelect" class="bg-[#121214] border border-zinc-700 rounded p-2 text-sm outline-none text-zinc-500 cursor-not-allowed" disabled>
                        <option value="1">Clothes (Category 1)</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="text-xs text-zinc-400 mb-1 font-bold uppercase">Min Price</label>
                    <input type="number" id="minPriceInput" placeholder="Min $" class="bg-[#121214] border border-zinc-700 rounded p-2 text-sm w-24 outline-none focus:border-[#5865f2] text-white">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs text-zinc-400 mb-1 font-bold uppercase">Max Price</label>
                    <input type="number" id="maxPriceInput" placeholder="Max $" class="bg-[#121214] border border-zinc-700 rounded p-2 text-sm w-24 outline-none focus:border-[#5865f2] text-white">
                </div>

                <div class="flex flex-col">
                    <label class="text-xs text-zinc-400 mb-1 font-bold uppercase">Sort Price</label>
                    <select id="sortSelect" class="bg-[#121214] border border-zinc-700 rounded p-2 text-sm outline-none focus:border-[#5865f2] text-white">
                        <option value="default">Default</option>
                        <option value="low-high">Lowest to Highest</option>
                        <option value="high-low">Highest to Lowest</option>
                    </select>
                </div>
            </div>

            <div id="product-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pb-10">
                </div>
        </div>

        <div class="w-full md:w-1/4">
            <div class="auth-card sticky top-24 p-4">
                <h2 class="text-xl font-bold mb-4 border-b border-zinc-700 pb-2">Your Cart</h2>
                
                <div id="cart-container" class="min-h-[150px] max-h-[400px] overflow-y-auto mb-4 space-y-2 pr-2 no-scrollbar">
                    <p class="text-zinc-500 text-sm italic text-center mt-10">Cart is empty</p>
                </div>

                <div class="border-t border-zinc-700 pt-4 mt-4">
                    <div class="flex justify-between font-bold text-lg mb-4">
                        <span>Total:</span>
                        <span class="text-[#5865f2]">$<span id="cart-total">0</span></span>
                    </div>
                    <button id="checkoutBtn" class="btn-primary w-full py-3 text-lg">Checkout</button>
                </div>
                
                <div id="checkout-message" class="mt-3 text-center text-sm font-bold hidden"></div>
            </div>
        </div>

    </div>

    <div id="globalModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50">
        <div class="bg-[#0f172a] rounded-xl p-6 w-full max-w-sm text-center border border-zinc-700 shadow-lg">
            <p id="globalModalMessage" class="text-white text-base mb-4"></p>
            <button id="globalModalClose" class="bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold py-2 px-4 rounded">OK</button>
        </div>
    </div>

    <script type="module">
        import { getCurrentUser, logout } from './auth.js';
        
        const state = { user: getCurrentUser() };

        if (!state.user) {
            window.location.href = 'Login.html';
        } else {
            document.getElementById('uName').innerText = state.user.username;
        }

        document.getElementById('logoutBtn').onclick = logout;

        document.getElementById('globalModalClose').addEventListener('click', () => {
            const overlay = document.getElementById('globalModal');
            overlay.classList.add('hidden');
            overlay.classList.remove('flex');
        });

        document.getElementById('globalModal').addEventListener('click', (e) => {
            if (e.target.id === 'globalModal') {
                e.target.classList.add('hidden');
                e.target.classList.remove('flex');
            }
        });
    </script>

    <script src="shop.js"></script>
</body>
</html>
