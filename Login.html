<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/5865f2/lock--v1.png" />
    <title>Login - Auth System</title>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="auth-card">
        <h2 class="text-2xl font-bold mb-6 text-center">User Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-sm text-zinc-400 block mb-1">Email</label>
                <input type="email" name="email" required>
            </div>
            <div>
                <label class="text-sm text-zinc-400 block mb-1">Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary mt-4">Login</button>
        </form>
        <p class="text-center text-zinc-500 text-sm mt-6">
            No account? <a href="Signup.html" class="text-[#5865f2] hover:underline">Sign up</a>
        </p>
    </div>

    <script type="module">
        import { login } from './auth.js';
        let state = { email: "", password: "" }; //

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', (e) => {
                state[e.target.name] = e.target.value;
            });
        });

        function openAlertModal(message) {
            const modal = document.getElementById('globalModal');
            const messageEl = document.getElementById('globalModalMessage');
            if (!modal || !messageEl) {
                alert(message);
                return;
            }
            messageEl.textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAlertModal() {
            const modal = document.getElementById('globalModal');
            if (modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        }

        document.getElementById('globalModalClose').addEventListener('click', closeAlertModal);
        document.getElementById('globalModal').addEventListener('click', (e) => {
            if (e.target.id === 'globalModal') closeAlertModal();
        });

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const result = login(state.email, state.password);
            if (result.success) window.location.href = 'Home.html';
            else openAlertModal(result.message);
        };
    </script>

    <div id="globalModal" class="hidden fixed inset-0 z-50 items-center justify-center bg-black/50">
        <div class="bg-[#0f172a] rounded-xl p-6 w-full max-w-sm text-center border border-zinc-700 shadow-lg">
            <p id="globalModalMessage" class="text-white text-base mb-4"></p>
            <button id="globalModalClose" class="bg-[#5865f2] hover:bg-[#4752c4] text-white font-bold py-2 px-4 rounded">OK</button>
        </div>
    </div>
</body>
</html>
