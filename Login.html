<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <title>Login - Auth System</title>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="auth-card">
        <h2 class="text-2xl font-bold mb-6 text-center">User Login</h2>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="text-sm text-zinc-400 block mb-1">Email</label>
                <input type="email" name="email" required>
            </div>
            <div>
                <label class="text-sm text-zinc-400 block mb-1">Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary mt-4">Login</button>
        </form>
        <p class="text-center text-zinc-500 text-sm mt-6">
            No account? <a href="Signup.html" class="text-[#5865f2] hover:underline">Sign up</a>
        </p>
    </div>

    <script type="module">
        import { login } from './auth.js';
        let state = { email: "", password: "" }; //

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', (e) => {
                state[e.target.name] = e.target.value;
            });
        });

        document.getElementById('loginForm').onsubmit = (e) => {
            e.preventDefault();
            const result = login(state.email, state.password);
            if (result.success) window.location.href = 'Home.html'; //
            else alert(result.message);
        };
    </script>
</body>
</html>
